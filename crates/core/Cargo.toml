[package]
name = "keyward-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
getrandom = "0.4.3"
# The account's key in file names: a hash of its id rather than the email.
sha2 = "0.10"
# A certificate's hash, the way a code requirement spells an anchor.
sha1 = "0.10"
# The channel to the daemon: Noise, NK, over the control socket.
snow = "0.10"
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
