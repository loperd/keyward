[package]
name = "keyward-plugin-hashicorp"
version.workspace = true
edition.workspace = true
license.workspace = true

# A plugin is both a library and a program. The showcase package builds the
# program: the daemon talks to it in lines of JSON through the
# `keyward-plugin-stdio` bridge.
[[bin]]
name = "keyward-plugin-hashicorp"
path = "src/bin/hashicorp.rs"

[dependencies]
keyward-core.workspace = true
keyward-plugin.workspace = true
keyward-plugin-stdio.workspace = true
keyward-ui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
percent-encoding = "2.3.2"

[dev-dependencies]
keyward-plugin = { workspace = true, features = ["testing"] }
