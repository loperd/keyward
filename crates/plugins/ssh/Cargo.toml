[package]
name = "keyward-plugin-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

# A plugin is both a library and a program. The showcase package builds the
# program: the daemon talks to it in lines of JSON through the
# `keyward-plugin-stdio` bridge.
[[bin]]
name = "keyward-plugin-ssh"
path = "src/bin/ssh.rs"

[dependencies]
keyward-core.workspace = true
keyward-plugin.workspace = true
keyward-plugin-stdio.workspace = true
# The routes, the host key check, the login signed by the core and the sealed
# link: shared with every plugin that goes to a server over ssh.
keyward-ssh-client.workspace = true
# The plugin's places on the window's path, and the sealed road they travel.
keyward-ui.workspace = true
# Reading a pasted key for the editor, with the same rules the vault saves by.
keyward-sshkey.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
async-trait = "0.1"
ssh-agent-lib = "0.5.1"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "p521", "dsa", "alloc", "std"] }
# The signature arrives from the core in ssh's wire form and has to be parsed
# back.
ssh-encoding = { version = "0.2", features = ["alloc"] }
# The terminal's ssh client. Pure Rust on tokio: the same code on macOS, Linux
# and Windows, with no system ssh and no local pty. `ring` rather than the
# default aws-lc-rs: it builds everywhere without cmake or nasm.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
zeroize = { version = "1.9.0", features = ["serde"] }

[dev-dependencies]
# The page's side of the sealed link, for the terminal's end-to-end test.
keyward-ssh-client = { workspace = true, features = ["testing"] }
keyward-plugin = { workspace = true, features = ["testing"] }
# The terminal's end-to-end test signs as the core would.
signature = "2"
# The setup timeout is tested on a paused clock rather than by waiting.
tokio = { workspace = true, features = ["test-util"] }
