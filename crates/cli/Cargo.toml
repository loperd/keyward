[package]
name = "keyward-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keyward"
path = "src/main.rs"

[dependencies]
keyward-core.workspace = true
keyward-vault.workspace = true
keyward-sshkey.workspace = true
keyward-plugin.workspace = true
# The plugin protocol's sealed transport, the same code on both ends.
keyward-plugin-stdio.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
libc = "0.2"
ssh-encoding = { version = "0.2", features = ["alloc"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "p521", "dsa", "alloc", "std"] }
signature = "2"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1.9.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
base64 = "0.22"
# Checking the signatures of plugin packages. The same crate ssh-key already
# pulls in.
ed25519-dalek = "2"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-foundation = "0.3.2"
