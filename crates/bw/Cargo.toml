[package]
name = "keyward-bw"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# The cryptography goes through RustCrypto's generic crates directly, with no
# wrappers over somebody else's library: Bitwarden's format is documented and the
# glue takes a couple of hundred lines.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = "0.5"
hkdf = "0.12"
rsa = "0.9"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
rand = "0.8"

[dev-dependencies]
# A make-believe Vaultwarden on loopback for the login and refresh tests.
tokio.workspace = true
