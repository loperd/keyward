[package]
name = "keyward-passkey-host"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser's way into the daemon for passkeys. A separate binary on
# purpose: Chrome starts a native host with arguments of its own, and the less
# code sits on this edge the better — it knows the socket and three requests,
# nothing else.
[[bin]]
name = "keyward-passkey-host"
path = "src/main.rs"

[dependencies]
keyward-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
zeroize = "1.9.0"
# The browser leg's seal: ECDH P-256, HKDF-SHA256, AES-256-GCM — what the
# extension's WebCrypto has built in.
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
