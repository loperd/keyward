        <span class="kws-stage">
          <span class="kws-col kws-c0"><i class="kws-cap"></i><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span></span>
          <span class="kws-col kws-c1"><i class="kws-cap"></i><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span><span class="kws-row"><i class="kws-tile"></i><span class="kws-two"><i></i><i></i></span></span></span>

            <i class="kws-head"></i><span class="kws-f"><i></i><i></i></span><span class="kws-f"><i></i><i></i></span>
            <span class="kws-status"><span class="kws-pulse"><span class="kws-ring"></span></span><span class="kws-track"></span></span>
          </span></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
